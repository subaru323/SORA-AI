<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SORA // REMOTE</title>
<style>
:root { --ec:#00d4ff; --bg:#000a12; --bg2:#000d18; --text:#cff4ff; --text2:#3a8aaa; }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Courier New',monospace;
       min-height:100dvh; display:flex; flex-direction:column; }

/* ── Header ── */
#header { display:flex; align-items:center; justify-content:space-between;
          padding:12px 16px; background:rgba(0,0,0,0.7);
          border-bottom:1px solid rgba(0,212,255,0.2); flex-shrink:0; }
#header h1 { font-size:16px; color:var(--ec); letter-spacing:.1em; }
#ws-dot { width:8px; height:8px; border-radius:50%; background:#ff4433;
          display:inline-block; margin-right:6px; transition:background .3s; }
#ws-dot.on { background:#00ff88; box-shadow:0 0 6px #00ff88; }
#ws-status { font-size:11px; color:var(--text2); }

/* ── Chat Log ── */
#chat-log { flex:1; overflow-y:auto; padding:12px 14px; display:flex;
            flex-direction:column; gap:8px; min-height:0; }
.msg { font-size:13px; line-height:1.5; padding:8px 12px; border-radius:6px; max-width:90%; }
.msg.sora { align-self:flex-start; background:rgba(0,212,255,.07);
            border-left:2px solid var(--ec); color:var(--ec); }
.msg.user { align-self:flex-end; background:rgba(255,255,255,.06);
            border-right:2px solid rgba(255,255,255,.3); color:rgba(255,255,255,.7); }
.msg.sys  { align-self:center; font-size:11px; color:var(--text2);
            background:rgba(0,0,0,.4); border:1px solid rgba(0,212,255,.1);
            border-radius:4px; padding:4px 10px; }
.msg-label { font-size:9px; letter-spacing:.1em; opacity:.6; margin-bottom:2px; }

/* ── Status Bar ── */
#status-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
              padding:8px 14px; background:rgba(0,0,0,.5);
              border-top:1px solid rgba(0,212,255,.08); flex-shrink:0; }
.stat-cell { text-align:center; }
.stat-lbl { font-size:9px; color:var(--text2); letter-spacing:.08em; }
.stat-val { font-size:14px; font-weight:bold; color:var(--ec); }

/* ── Quick Actions ── */
#quick-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
                 padding:8px 14px; flex-shrink:0; }
.qa-btn { background:transparent; border:1px solid rgba(0,212,255,.3); color:var(--ec);
          border-radius:6px; padding:8px 4px; font-size:11px; cursor:pointer;
          font-family:monospace; letter-spacing:.05em; transition:all .15s; }
.qa-btn:hover { background:rgba(0,212,255,.12); border-color:var(--ec); }
.qa-btn.danger { border-color:rgba(255,68,51,.4); color:#ff6644; }
.qa-btn.danger:hover { background:rgba(255,68,51,.1); }

/* ── Input ── */
#input-area { display:flex; gap:8px; padding:10px 14px 14px; flex-shrink:0;
              border-top:1px solid rgba(0,212,255,.1); }
#msg-input { flex:1; background:rgba(0,0,0,.6); border:1px solid rgba(0,212,255,.3);
             color:var(--text); border-radius:6px; padding:9px 12px; font-size:13px;
             font-family:monospace; outline:none; }
#msg-input:focus { border-color:var(--ec); box-shadow:0 0 8px rgba(0,212,255,.2); }
#send-btn { background:transparent; border:1px solid var(--ec); color:var(--ec);
            border-radius:6px; padding:0 16px; font-size:12px; cursor:pointer;
            font-family:monospace; font-weight:bold; letter-spacing:.06em; }
#send-btn:hover { background:rgba(0,212,255,.1); }
</style>
</head>
<body>

<div id="header">
    <h1>// SORA REMOTE</h1>
    <div><span id="ws-dot"></span><span id="ws-status">OFFLINE</span></div>
</div>

<div id="chat-log">
    <div class="msg sys">オペレーター画面 — SORAに接続中...</div>
</div>

<div id="status-bar">
    <div class="stat-cell">
        <div class="stat-lbl">STATUS</div>
        <div class="stat-val" id="s-mode">--</div>
    </div>
    <div class="stat-cell">
        <div class="stat-lbl">TODAY</div>
        <div class="stat-val" id="s-today">--</div>
    </div>
    <div class="stat-cell">
        <div class="stat-lbl">NOW</div>
        <div class="stat-val" id="s-now">--</div>
    </div>
</div>

<div id="quick-actions">
    <button class="qa-btn" onclick="cmd('mirror')">🔄 MIRROR</button>
    <button class="qa-btn" onclick="cmd('mute')">🔇 MUTE</button>
    <button class="qa-btn" onclick="cmd('unmute')">🔊 UNMUTE</button>
    <button class="qa-btn" onclick="announce('いらっしゃいませ。本日はご来場ありがとうございます。')">👋 挨拶</button>
    <button class="qa-btn" onclick="announce('ただいまより説明を開始いたします。')">📢 開始</button>
    <button class="qa-btn" onclick="announce('以上で本日の説明を終了いたします。')">🏁 終了</button>
    <button class="qa-btn danger" onclick="cmd('reset')">🔃 RESET</button>
    <button class="qa-btn" onclick="cmd('game_start')">🎮 GAME</button>
    <button class="qa-btn" onclick="cmd('status')">📊 STATUS</button>
</div>

<div id="input-area">
    <input type="text" id="msg-input" placeholder="SORAに話しかける..." autocomplete="off">
    <button id="send-btn" onclick="sendMsg()">SEND</button>
</div>

<script>
let ws = null;

function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/remote`);

    ws.onopen = () => {
        document.getElementById('ws-dot').classList.add('on');
        document.getElementById('ws-status').textContent = 'ONLINE';
        addMsg('sys', '接続しました');
    };

    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'sora_speak')   addMsg('sora', msg.text);
        if (msg.type === 'user_speak')   addMsg('user', msg.text);
        if (msg.type === 'status_update') {
            document.getElementById('s-mode').textContent  = msg.mode  || '--';
            document.getElementById('s-today').textContent = msg.today != null ? msg.today + '人' : '--';
            document.getElementById('s-now').textContent   = msg.now   != null ? msg.now + '人'  : '--';
        }
        if (msg.type === 'system_error') addMsg('sys', '⚠ ' + msg.text);
    };

    ws.onclose = () => {
        document.getElementById('ws-dot').classList.remove('on');
        document.getElementById('ws-status').textContent = 'OFFLINE';
        addMsg('sys', '切断 — 3秒後に再接続...');
        setTimeout(connect, 3000);
    };
}

function addMsg(role, text) {
    const log = document.getElementById('chat-log');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    if (role !== 'sys') {
        const lbl = document.createElement('div');
        lbl.className = 'msg-label';
        lbl.textContent = role === 'sora' ? 'SORA' : 'USER';
        div.appendChild(lbl);
    }
    const t = document.createElement('span');
    t.textContent = text;
    div.appendChild(t);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function sendMsg() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'remote_speak', text }));
    input.value = '';
}

function announce(text) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'remote_announce', text }));
    addMsg('sys', '📢 ' + text);
}

function cmd(action) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'remote_cmd', action }));
    addMsg('sys', `CMD: ${action}`);
}

document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendMsg(); }
});

connect();
</script>
</body>
</html>
